name: Paid Issue Finder

on:
  workflow_dispatch:
    inputs:
      query:
        description: "GitHub issue search query"
        required: true
        default: '"bounty" OR "reward" state:open'
      topn:
        description: "Maximum results"
        required: true
        default: "30"
      language:
        description: "Optional language filter (e.g. Python, TypeScript)"
        required: false
        default: ""

permissions:
  contents: write
  issues: read

jobs:
  find-bounties:
    runs-on: ubuntu-latest
    steps:
      - name: Search GitHub issues
        env:
          GH_TOKEN: ${{ github.token }}
          QUERY: ${{ inputs.query }}
          TOPN: ${{ inputs.topn }}
          LANGUAGE: ${{ inputs.language }}
        shell: bash
        run: |
          set -euo pipefail
          SEARCH_QUERY="$QUERY"
          if [ -n "$LANGUAGE" ]; then SEARCH_QUERY="$SEARCH_QUERY language:$LANGUAGE"; fi
          gh search issues "$SEARCH_QUERY" --limit "$TOPN" --json number,title,url,repository,labels,body,comments,createdAt,updatedAt,author > issues.json
          python - <<'PY'
          import json, re
          from pathlib import Path
          data = json.loads(Path("issues.json").read_text())
          suspicious_terms = ("pppdud", "take your money back", "follow my", "backflip", "gazillion", "value: 0.00", "approximately 0 usd", "currency: tbd", "currency not decided", "bounty is negative")
          def bounty(text):
              patterns = [
                  r"\$\s?([0-9]+(?:,[0-9]{3})*(?:\.[0-9]+)?)",
                  r"(?:USD|US\$)\s?([0-9]+(?:,[0-9]{3})*(?:\.[0-9]+)?)",
                  r"([0-9]+(?:,[0-9]{3})*(?:\.[0-9]+)?)\s*(?:USD|dollars?)",
              ]
              values = []
              for p in patterns:
                  for x in re.findall(p, text, re.I):
                      v = float(x.replace(",", ""))
                      if 0 < v <= 100000: values.append(v)
              return max(values) if values else None
          rows = []
          for issue in data:
              repo = issue["repository"]["nameWithOwner"]
              repo_json = __import__("subprocess").check_output(
                  ["gh", "api", f"repos/{repo}"],
                  text=True
              )
              repo_meta = json.loads(repo_json)
              stars = repo_meta.get("stargazers_count", 0)
              forks = repo_meta.get("forks_count", 0)
              open_issues = repo_meta.get("open_issues_count", 0)
              pushed_at = repo_meta.get("pushed_at") or ""
              archived = repo_meta.get("archived", False)
              repo_score = min(stars / 100, 10) + min(forks / 20, 5)
              if pushed_at:
                  repo_score += 5
              if not archived:
                  repo_score += 5
              repo_score = min(repo_score, 25)
              issue["_repo_stars"] = stars
              issue["_repo_forks"] = forks
              issue["_repo_score"] = repo_score
              issue["_repo_archived"] = archived
              text = (issue.get("title") or "") + " " + (issue.get("body") or "")
              value = bounty(text)
              labels = " ".join(x["name"] for x in issue.get("labels", []))
              lower = text.lower()
              suspicious = any(x in lower for x in suspicious_terms)
              weak_claim = any(x in lower for x in ("up to ", "terms and conditions apply", "expiry is", "pay you in btc", "pay in btc", "pay in crypto"))
              confidence = "high" if value and any(k in labels.lower() for k in ("bounty", "reward", "paid")) and not suspicious and not weak_claim else ("medium" if value and not suspicious and not weak_claim else ("low" if value else "none"))
              if value:
                  risk = 0
                  risk_reasons = []
                  if suspicious:
                      risk += 45
                      risk_reasons.append("suspicious wording")
                  if weak_claim:
                      risk += 15
                      risk_reasons.append("conditional/weak payment claim")
                  if issue["_repo_archived"]:
                      risk += 30
                      risk_reasons.append("archived repository")
                  if issue["_repo_stars"] < 10:
                      risk += 10
                      risk_reasons.append("very low repository activity")
                  if issue.get("comments", 0) == 0:
                      risk += 5
                      risk_reasons.append("no discussion")
                  risk = min(risk, 100)
                  score = min(value / 100, 50) + {"high": 10, "medium": 5, "low": 0, "none": 0}[confidence] + min(issue.get("comments", 0) / 10, 5) + issue["_repo_score"] - (risk * 0.25)
                  if risk >= 60:
                      score -= 15
                  issue["_risk"] = risk
                  issue["_risk_reasons"] = risk_reasons
                  rows.append((score, value, confidence, suspicious, issue))
          rows.sort(reverse=True, key=lambda x: x[0])
          rows = rows[:50]

          report = ["# Paid Issue Finder Report", "", f"Query: `{__import__('os').environ['QUERY']}`", ""]
          report.append(f"Generated: {__import__('datetime').datetime.now(__import__('datetime').timezone.utc).isoformat()}")
          report.append("")
          if not rows:
              report.append("No monetary bounty detected.")
          else:
              for score, value, confidence, suspicious, issue in rows:
                  repo = issue["repository"]["nameWithOwner"]
                  flag = " ⚠️ suspicious" if suspicious else ""
                  risk = issue.get("_risk", 0)
                  reasons = ", ".join(issue.get("_risk_reasons", [])) or "no major risk signal"
                  report.append("- **US$%.2f** · Opportunity %.1f · Risk %d · %s%s — [%s#%s: %s](%s) — %s" % (value, score, risk, confidence, flag, repo, issue["number"], issue["title"], issue["url"], reasons))
          Path("REPORT.md").write_text("\\n".join(report) + "\\n", encoding="utf-8")
          print("\n## Paid Issue Finder results\n")
          if not rows:
              print("No monetary bounty detected in the selected issues.")
          else:
              for score, value, confidence, suspicious, issue in rows:
                  repo = issue["repository"]["nameWithOwner"]
                  flag = " ⚠️ suspicious" if suspicious else ""
                  print("- **US$%.2f** · Opportunity %.1f · Risk %d · %s%s — [%s#%s: %s](%s)" % (value, score, risk, confidence, flag, repo, issue["number"], issue["title"], issue["url"]))
          PY

      - name: Publish report
        uses: actions/upload-artifact@v4
        with:
          name: paid-issue-finder-report
          path: REPORT.md
