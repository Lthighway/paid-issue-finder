name: Paid Issue Finder

concurrency:
  group: paid-issue-finder
  cancel-in-progress: true

on:
  push:
    branches: ["main"]
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:
    inputs:
      query:
        description: "GitHub issue search query"
        required: true
        default: '"bounty" OR "reward" state:open'
      topn:
        description: "Maximum results"
        required: true
        default: "100"
      language:
        description: "Optional language filter (e.g. Python, TypeScript)"
        required: false
        default: ""
      min_bounty:
        description: "Minimum bounty in USD"
        required: false
        default: "0"
      max_bounty:
        description: "Maximum bounty in USD"
        required: false
        default: "100000"
      min_opportunity:
        description: "Minimum opportunity score"
        required: false
        default: "0"

permissions:
  contents: write
  issues: read

jobs:
  find-bounties:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Search GitHub issues
        env:
          GH_TOKEN: ${{ github.token }}
          QUERY: ${{ inputs.query || '"bounty" OR "reward" state:open' }}
          TOPN: ${{ inputs.topn || '100' }}
          LANGUAGE: ${{ inputs.language || '' }}
          MIN_BOUNTY: ${{ inputs.min_bounty || '0' }}
          MAX_BOUNTY: ${{ inputs.max_bounty || '100000' }}
          MIN_OPPORTUNITY: ${{ inputs.min_opportunity || '0' }}
        shell: bash
        run: |
          set -euo pipefail
          SEARCH_QUERY="$QUERY"
          if [ -n "$LANGUAGE" ]; then SEARCH_QUERY="$SEARCH_QUERY language:$LANGUAGE"; fi
          gh search issues "$SEARCH_QUERY" --limit "$TOPN" --json number,title,url,repository,labels,body,commentsCount,createdAt,updatedAt,author > issues.json
          PYTHONPATH=. python scripts/run_finder.py

      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add REPORT.md
          git diff --cached --quiet && exit 0
          git commit -m "Update live bounty report"
          git pull --rebase origin main
          git push

      - name: Publish report
        uses: actions/upload-artifact@v4
        with:
          name: paid-issue-finder-report
          path: REPORT.md
