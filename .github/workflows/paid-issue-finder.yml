name: Paid Issue Finder

on:
  workflow_dispatch:
    inputs:
      query:
        description: "GitHub issue search query"
        required: true
        default: '"bounty" OR "reward" state:open'
      topn:
        description: "Maximum results"
        required: true
        default: "30"
      language:
        description: "Optional language filter (e.g. Python, TypeScript)"
        required: false
        default: ""
      min_bounty:
        description: "Minimum bounty in USD"
        required: false
        default: "0"
      max_bounty:
        description: "Maximum bounty in USD"
        required: false
        default: "100000"
      min_opportunity:
        description: "Minimum opportunity score"
        required: false
        default: "0"

permissions:
  contents: write
  issues: read

jobs:
  find-bounties:
    runs-on: ubuntu-latest
    steps:
      - name: Search GitHub issues
        env:
          GH_TOKEN: ${{ github.token }}
          QUERY: ${{ inputs.query }}
          TOPN: ${{ inputs.topn }}
          LANGUAGE: ${{ inputs.language }}
          MIN_BOUNTY: ${{ inputs.min_bounty }}
          MAX_BOUNTY: ${{ inputs.max_bounty }}
          MIN_OPPORTUNITY: ${{ inputs.min_opportunity }}
        shell: bash
        run: |
          set -euo pipefail
          SEARCH_QUERY="$QUERY"
          if [ -n "$LANGUAGE" ]; then SEARCH_QUERY="$SEARCH_QUERY language:$LANGUAGE"; fi
          gh search issues "$SEARCH_QUERY" --limit "$TOPN" --json number,title,url,repository,labels,body,comments,createdAt,updatedAt,author > issues.json
          python - <<'PY'
          import json, re
          from pathlib import Path
          data = json.loads(Path("issues.json").read_text())
          suspicious_terms = ("pppdud", "take your money back", "follow my", "backflip", "gazillion", "value: 0.00", "approximately 0 usd", "currency: tbd", "currency not decided", "bounty is negative")
          def bounty(text):
              patterns = [
                  r"\$\s?([0-9]+(?:,[0-9]{3})*(?:\.[0-9]+)?)",
                  r"(?:USD|US\$)\s?([0-9]+(?:,[0-9]{3})*(?:\.[0-9]+)?)",
                  r"([0-9]+(?:,[0-9]{3})*(?:\.[0-9]+)?)\s*(?:USD|dollars?)",
              ]
              values = []
              for p in patterns:
                  for x in re.findall(p, text, re.I):
                      v = float(x.replace(",", ""))
                      if 0 < v <= 100000: values.append(v)
              return max(values) if values else None
          rows = []
          for issue in data:
              repo = issue["repository"]["nameWithOwner"]
              repo_json = __import__("subprocess").check_output(
                  ["gh", "api", f"repos/{repo}"],
                  text=True
              )
              repo_meta = json.loads(repo_json)
              stars = repo_meta.get("stargazers_count", 0)
              forks = repo_meta.get("forks_count", 0)
              open_issues = repo_meta.get("open_issues_count", 0)
              default_branch = repo_meta.get("default_branch", "main")
              pushed_at = repo_meta.get("pushed_at") or ""
              archived = repo_meta.get("archived", False)
              repo_score = min(stars / 100, 10) + min(forks / 20, 5)
              if pushed_at:
                  repo_score += 5
              if not archived:
                  repo_score += 5
              repo_score = min(repo_score, 25)
              issue["_repo_stars"] = stars
              issue["_repo_forks"] = forks
              issue["_repo_score"] = repo_score
              issue["_repo_archived"] = archived
              issue["_default_branch"] = default_branch
              text = (issue.get("title") or "") + " " + (issue.get("body") or "")
              value = bounty(text)
              if value is None or value < float(__import__("os").environ["MIN_BOUNTY"]) or value > float(__import__("os").environ["MAX_BOUNTY"]):
                  continue
              labels = " ".join(x["name"] for x in issue.get("labels", []))
              lower = text.lower()
              suspicious = any(x in lower for x in suspicious_terms)
              weak_claim = any(x in lower for x in ("up to ", "terms and conditions apply", "expiry is", "pay you in btc", "pay in btc", "pay in crypto"))
              acceptance_signals = ("acceptance criteria", "acceptance criterion", "definition of done", "expected behavior", "requirements", "reproduction steps", "steps to reproduce", "how to reproduce")
              quality_labels = ("good first issue", "help wanted", "bounty", "reward", "paid")
              issue_quality = 0
              history_score = 0
              history_reasons = []
              quality_reasons = []
              if any(x in lower for x in acceptance_signals):
                  issue_quality += 20
                  quality_reasons.append("clear requirements/acceptance")
              if any(x in labels.lower() for x in quality_labels):
                  issue_quality += 10
                  quality_reasons.append("useful issue label")
              if len(issue.get("body") or "") >= 500:
                  issue_quality += 10
                  quality_reasons.append("detailed issue description")
              if any(x in lower for x in ("steps to reproduce", "reproduction steps", "how to reproduce")):
                  issue_quality += 10
                  quality_reasons.append("reproduction guidance")
              issue_quality = min(issue_quality, 40)
              maintainer_score = 0
              maintainer_reasons = []
              author = (issue.get("author") or {}).get("login")
              if author:
                  maintainer_score += 5
                  maintainer_reasons.append("identified issue author")
              if issue.get("comments", 0) >= 2:
                  maintainer_score += 5
                  maintainer_reasons.append("active discussion")
              if issue.get("updatedAt"):
                  maintainer_score += 5
                  maintainer_reasons.append("recently updated")
              issue["_maintainer_score"] = min(maintainer_score, 15)
              issue["_maintainer_reasons"] = maintainer_reasons
              try:
                  prs = json.loads(__import__("subprocess").check_output(["gh", "api", "--paginate", f"repos/{repo}/pulls?state=closed&per_page=30"], text=True))
                  linked_prs = json.loads(__import__("subprocess").check_output(["gh", "api", f"repos/{repo}/issues/{issue['number']}/timeline"], text=True))
              except Exception:
                  prs = []
                  linked_prs = []
              merged = sum(1 for pr in prs if pr.get("merged_at"))
              linked_merged = 0
              linked_closed = 0
              for event in linked_prs:
                  source = event.get("source", {}).get("issue", {})
                  pr_ref = source.get("pull_request")
                  if event.get("event") == "cross-referenced" and pr_ref:
                      if source.get("state") == "closed":
                          linked_closed += 1
                      pr_url = pr_ref.get("html_url")
                      if pr_url:
                          try:
                              pr_number = pr_url.rstrip("/").split("/")[-1]
                              pr_data = json.loads(__import__("subprocess").check_output(["gh", "api", f"repos/{repo}/pulls/{pr_number}"], text=True))
                              if pr_data.get("merged_at"):
                                  linked_merged += 1
                          except Exception:
                              pass
              issue["_linked_merged"] = linked_merged
              issue["_linked_closed"] = linked_closed
              if linked_merged:
                  history_score += min(linked_merged * 7, 15)
                  history_reasons.append("issue linked to merged PR")
              elif linked_closed:
                  history_score += 2
                  history_reasons.append("issue linked to closed PR")
              if merged:
                  history_score += min(merged * 2, 10)
                  history_reasons.append(f"{merged} recently merged PRs")
              if prs:
                  history_score += 5
                  history_reasons.append("repository accepts pull requests")
              history_score = min(history_score, 15)
              confidence = "high" if value and any(k in labels.lower() for k in ("bounty", "reward", "paid")) and not suspicious and not weak_claim else ("medium" if value and not suspicious and not weak_claim else ("low" if value else "none"))
              if value:
                  risk = 0
                  risk_reasons = []
                  if suspicious:
                      risk += 45
                      risk_reasons.append("suspicious wording")
                  if weak_claim:
                      risk += 15
                      risk_reasons.append("conditional/weak payment claim")
                  if issue["_repo_archived"]:
                      risk += 30
                      risk_reasons.append("archived repository")
                  if issue["_repo_stars"] < 10:
                      risk += 10
                      risk_reasons.append("very low repository activity")
                  if issue.get("comments", 0) == 0:
                      risk += 5
                      risk_reasons.append("no discussion")
                  risk = min(risk, 100)
                  score = min(value / 100, 50) + {"high": 10, "medium": 5, "low": 0, "none": 0}[confidence] + min(issue.get("comments", 0) / 10, 5) + issue["_repo_score"] + issue_quality + history_score + issue["_maintainer_score"] - (risk * 0.25)
                  if risk >= 60:
                      score -= 15
                  issue["_risk"] = risk
                  issue["_risk_reasons"] = risk_reasons
                  issue["_quality"] = issue_quality
                  issue["_quality_reasons"] = quality_reasons
                  issue["_history_score"] = history_score
                  issue["_history_reasons"] = history_reasons
                  issue["_maintainer_score"] = maintainer_score
                  rows.append((score, value, confidence, suspicious, issue))
          rows.sort(reverse=True, key=lambda x: x[0])
          rows = [r for r in rows if r[0] >= float(__import__("os").environ["MIN_OPPORTUNITY"])]
          rows = rows[:50]

          report = ["# Paid Issue Finder Report", "", f"Query: `{__import__('os').environ['QUERY']}`", ""]
          report.append(f"Generated: {__import__('datetime').datetime.now(__import__('datetime').timezone.utc).isoformat()}")
          report.append("")
          report.append("Filters: bounty US$%s–US$%s, opportunity >= %s" % (__import__("os").environ["MIN_BOUNTY"], __import__("os").environ["MAX_BOUNTY"], __import__("os").environ["MIN_OPPORTUNITY"]))
          report.append("")
          if not rows:
              report.append("No monetary bounty detected.")
          else:
              for score, value, confidence, suspicious, issue in rows:
                  repo = issue["repository"]["nameWithOwner"]
                  flag = " ⚠️ suspicious" if suspicious else ""
                  risk = issue.get("_risk", 0)
                  quality = issue.get("_quality", 0)
                  history = issue.get("_history_score", 0)
                  maintainer = issue.get("_maintainer_score", 0)
                  reasons = ", ".join(issue.get("_risk_reasons", [])) or "no major risk signal"
                  quality_reasons = ", ".join(issue.get("_quality_reasons", [])) or "no explicit quality signal"
                  history_reasons = ", ".join(issue.get("_history_reasons", [])) or "no contribution history signal"
                  maintainer_reasons = ", ".join(issue.get("_maintainer_reasons", [])) or "no maintainer activity signal"
                  evidence = [
                      "Reward: explicit monetary value detected",
                      "Repository: %d stars, %d forks" % (issue["_repo_stars"], issue["_repo_forks"]),
                      "Quality: " + quality_reasons,
                      "Contribution: " + history_reasons,
                      "Maintainer: " + maintainer_reasons,
                      "Risk: " + reasons,
                  ]
                  if risk >= 60:
                      verdict = "AVOID"
                  elif score >= 50 and risk <= 30:
                      verdict = "GO"
                  else:
                      verdict = "REVIEW"
                  report.append("- **US$%.2f** · Opportunity %.1f · Risk %d · Quality %d · History %d · Maintainer %d · **%s** · %s%s — [%s#%s: %s](%s)" % (value, score, risk, quality, history, maintainer, verdict, confidence, flag, repo, issue["number"], issue["title"], issue["url"]))
                  report.append("  - " + " | ".join(evidence))
          Path("REPORT.md").write_text("\\n".join(report) + "\\n", encoding="utf-8")
          print("\n## Paid Issue Finder results\n")
          if not rows:
              print("No monetary bounty detected in the selected issues.")
          else:
              for score, value, confidence, suspicious, issue in rows:
                  repo = issue["repository"]["nameWithOwner"]
                  flag = " ⚠️ suspicious" if suspicious else ""
                  risk = issue.get("_risk", 0)
                  quality = issue.get("_quality", 0)
                  history = issue.get("_history_score", 0)
                  verdict = "AVOID" if risk >= 60 else ("GO" if score >= 50 and risk <= 30 else "REVIEW")
                  print("- **US$%.2f** · Opportunity %.1f · Risk %d · Quality %d · %s · %s%s — [%s#%s: %s](%s)" % (value, score, risk, quality, history, verdict, confidence, flag, repo, issue["number"], issue["title"], issue["url"]))
          PY

      - name: Publish report
        uses: actions/upload-artifact@v4
        with:
          name: paid-issue-finder-report
          path: REPORT.md
